
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medfusion-ai-service"
version = "0.1.0"
description = "AI processing, RAG, and multimodal analysis for MedFusion"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
]

[project.optional-dependencies]
documents = [
    "pypdf",
]
rag = [
    "sentence-transformers",
    "chromadb",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["notebooks*"]
